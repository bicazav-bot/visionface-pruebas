[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests
addopts = -v --tb=short
markers =
    unit: pruebas unitarias (funciones aisladas)
    integration: pruebas de integracion (rutas + vistas + BD + OpenCV)
    functional: pruebas funcionales end-to-end con Selenium (requiere Microsoft Edge)
