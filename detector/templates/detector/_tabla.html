<table class="tabla" id="tabla-detecciones">
  <thead><tr><th>Fecha</th><th>Tipo</th><th>Archivo</th><th>Rostros</th><th>Cuadros</th><th>Tiempo</th></tr></thead>
  <tbody>
  {% for d in detecciones %}
    <tr>
      <td>{{ d.fecha|date:"d/m/Y H:i" }}</td>
      <td><span class="etiqueta {{ d.tipo }}">{{ d.get_tipo_display }}</span></td>
      <td>{{ d.nombre_archivo }}</td>
      <td>{{ d.rostros }}</td>
      <td>{{ d.cuadros_analizados }}</td>
      <td>{{ d.duracion_ms }} ms</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
