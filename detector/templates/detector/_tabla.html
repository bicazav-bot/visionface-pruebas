{% if detecciones %}
<table class="tabla" id="tabla-detecciones">
  <tr><th>Fecha</th><th>Tipo</th><th>Archivo</th><th>Rostros</th></tr>
  {% for d in detecciones %}
  <tr>
    <td>{{ d.fecha|date:"d/m/Y H:i" }}</td>
    <td>{{ d.tipo }}</td>
    <td>{{ d.archivo }}</td>
    <td>{{ d.rostros }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="vacio" id="sin-registros">Aún no hay análisis.</p>
{% endif %}
